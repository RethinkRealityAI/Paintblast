# Netlify configuration for Splotopia (formerly PaintBlast MR; the site
# is still served from paintblast-mr.netlify.app).
# Deploys the Vite production build. WebXR requires HTTPS, which Netlify provides.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.1"

# Long-cache immutable hashed assets from Vite; HTML stays fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
